name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      # Publishing a GitHub Release from main.
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          uploaded="$RUNNER_TEMP/uploaded.p12"
          if [ "$ON_MAIN" = "true" ] && [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Pasted secrets can pick up stray line breaks; neither value has any of its own.
            KEY_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$uploaded"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            # Pull requests, or main before the secrets exist: sign with a throwaway key made the
            # way the README's steps make one on a Mac (older ciphers included), so every build
            # checks the whole signing path.
            if [ "$ON_MAIN" = "true" ]; then
              echo "::warning::RELEASE_KEYSTORE_BASE64 or RELEASE_KEYSTORE_PASSWORD is not set, so no release is published. See the README."
            fi
            KEY_PASSWORD="throwaway-$RANDOM$RANDOM"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 30 -nodes -subj "/CN=Gallery test" \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
            openssl pkcs12 -export -legacy -name gallery -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -out "$uploaded" -passout "pass:$KEY_PASSWORD"
            rm "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.pem"
          fi
          export KEY_PASSWORD

          # macOS's openssl writes keystores with older ciphers that Java can fail to read. Unlock
          # the key here, which also checks the password, and save it again in the current format.
          if ! openssl pkcs12 -legacy -in "$uploaded" -passin env:KEY_PASSWORD -nodes \
              -out "$RUNNER_TEMP/key-and-cert.pem" 2>/dev/null; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD does not unlock the key in RELEASE_KEYSTORE_BASE64. Re-enter both secrets (see the README)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.p12"
          openssl pkcs12 -export -name gallery -in "$RUNNER_TEMP/key-and-cert.pem" -out "$keystore" \
            -passout env:KEY_PASSWORD
          rm "$uploaded" "$RUNNER_TEMP/key-and-cert.pem"
          echo "RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug and release APKs and run unit tests
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest

      - name: Check the app has no network permission
        run: |
          manifests=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml)
          test -n "$manifests" || { echo "No merged manifest found"; exit 1; }
          echo "$manifests"
          if grep -l 'android.permission.INTERNET' $manifests; then
            echo "The merged manifest requests network access"; exit 1
          fi

      - name: Check the app asks for no permissions beyond photos and videos
        run: |
          # A library adding any other permission (network state, location, notifications...)
          # fails the build until someone decides it belongs here.
          manifest=app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$manifest" || { echo "No merged release manifest found"; exit 1; }
          python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          name = "{http://schemas.android.com/apk/res/android}name"
          found = sorted({e.get(name) for e in ET.parse(sys.argv[1]).getroot().iter()
                          if e.tag.startswith("uses-permission")})
          allowed = {
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_VISUAL_USER_SELECTED",
              "android.permission.READ_EXTERNAL_STORAGE",
              # Declared by a library (it was already in releases before this check). It only
              # keeps the CPU awake; it reaches no data and nothing outside the phone.
              "android.permission.WAKE_LOCK",
              # AndroidX's own guard for receivers registered in code; signature-only.
              "com.dnlfx.gallery.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
          }
          print("\n".join(found))
          unexpected = [p for p in found if p not in allowed]
          if unexpected:
              print("::error::The app now asks for: " + ", ".join(unexpected))
              sys.exit(1)
          PY

      - name: Check the release APK is signed
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish a GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same file name in every release keeps one download link working:
          # https://github.com/${{ github.repository }}/releases/latest/download/gallery.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gallery.apk"
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/gallery.apk" \
            --target "$GITHUB_SHA" \
            --title "Gallery $VERSION_NAME" \
            --generate-notes \
            --latest
