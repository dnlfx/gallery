name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Check the app has no network permission
        run: |
          manifests=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml)
          test -n "$manifests" || { echo "No merged manifest found"; exit 1; }
          if grep -l 'android.permission.INTERNET' $manifests; then
            echo "The merged manifest requests network access"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
